<!doctype html>
<!--
  WebAuthn check for the Fleeting service (docs/design-plans/2026-11-05-deepthought-service.md,
  "Not checked"). It runs a passkey registration and a passkey login with the
  service's RP ID and options, in the browser only. Delete this directory when
  the check is done.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Passkey test</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Passkey test" />
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <style>
      body {
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          Roboto,
          sans-serif;
        margin: 0;
        padding: max(16px, env(safe-area-inset-top)) 16px 32px;
        line-height: 1.4;
      }
      button {
        font: inherit;
        font-size: 1.1em;
        padding: 12px 16px;
        margin: 4px 0;
        width: 100%;
        border-radius: 10px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        font-size: 13px;
        padding: 8px;
        border: 1px solid #8888;
        border-radius: 8px;
        min-height: 4em;
      }
    </style>
  </head>
  <body>
    <h1>Passkey test</h1>
    <p>
      Add this page to the home screen, open it from there, then tap the buttons
      in order. Send the text in the box below back.
    </p>
    <button id="register" type="button">1. Create test passkey</button>
    <button id="login" type="button">2. Log in with test passkey</button>
    <button id="login-any" type="button">3. Log in, choose any passkey</button>
    <button id="copy" type="button">Copy results</button>
    <pre id="log"></pre>
    <script src="./passkey-test.js"></script>
  </body>
</html>
